# A imagem base é a "unprivileged" do nginx, que roda como usuário comum e
# por isso escuta em 8080 (portas abaixo de 1024 exigiriam root).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback de SPA: o React cuida das rotas no navegador, então qualquer
    # caminho desconhecido devolve o index.html em vez de 404. Sem isso,
    # recarregar a página numa rota interna quebraria.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A API é servida sob o MESMO domínio do frontend, e não em
    # localhost:3000. Duas vantagens:
    #  1. O navegador nunca precisa saber o endereço da API — funciona igual
    #     acessando de outra máquina da rede (o PC Windows, o celular).
    #     Cravar "localhost:3000" na imagem só funcionaria na própria máquina.
    #  2. Sendo mesma origem, não há CORS envolvido aqui.
    # A barra final no proxy_pass é o que remove o prefixo /api antes de
    # repassar: /api/times chega no backend como /times.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Os arquivos com hash no nome (index-ChkGrBaF.js) podem ser cacheados
    # para sempre: mudou o conteúdo, muda o nome. Já o index.html não pode,
    # senão o navegador continuaria apontando para o bundle antigo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
